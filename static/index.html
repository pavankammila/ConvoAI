<!DOCTYPE html>

<html lang="en" data-theme="dark">

<head>

  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

  <meta name="theme-color" content="#0B0B0D">

  <title>ConvoAI — Think. Ask. Discover.</title>

  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%23ffa24d'/%3E%3Cstop offset='1' stop-color='%23ea580c'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='48' height='48' rx='13' fill='url(%23g)'/%3E%3Cpath fill='white' d='M18 11H30A8 8 0 0 1 38 19V24A8 8 0 0 1 30 32H25L18 38V32A8 8 0 0 1 10 24V19A8 8 0 0 1 18 11Z'/%3E%3Cpath fill='%23ea580c' d='M24 14.5C24.6 18.6 26.9 20.9 31 21.5C26.9 22.1 24.6 24.4 24 28.5C23.4 24.4 21.1 22.1 17 21.5C21.1 20.9 23.4 18.6 24 14.5Z'/%3E%3C/svg%3E">



  <!-- Apply saved theme + sidebar state before first paint (no flash) -->

  <script>

    (function () {

      var t = null, c = null;

      try { t = localStorage.getItem("convoai-theme-v2"); c = localStorage.getItem("convoai-sidebar"); } catch (e) {}

      if (!t) t = "dark";

      document.documentElement.dataset.theme = t;

      if (c === "collapsed") document.documentElement.classList.add("sb-collapsed");

    })();

  </script>



  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght\@9..144,400;9..144,500;9..144,600&family=Inter:wght\@400;500;600&display=swap" rel="stylesheet">



  <style>

    :root {

      color-scheme: light;

      --bg: #faf7f2;

      --sidebar: #f3eee6;

      --sb-hover: rgba(60, 40, 20, .06);

      --sb-active: rgba(234, 88, 12, .11);

      --sb-w: 288px;

      --surface: #fffefc;

      --surface-2: #f4efe7;

      --border: #e9e1d5;

      --border-strong: #dccfbd;

      --text: #2a241e;

      --muted: #8c8174;

      --accent: #ea580c;

      --accent-2: #ff8a3d;

      --accent-ink: #c2410c;

      --accent-soft: #fdeadb;

      --user-bg: #f6e8da;

      --code-bg: #2b2420;

      --code-head: #362e28;

      --code-text: #f6eee6;

      --ring: rgba(234, 88, 12, .28);

      --glow: rgba(255, 138, 61, .16);

      --shadow: 0 1px 2px rgba(60, 40, 20, .04), 0 10px 32px rgba(120, 70, 20, .08);

      --shadow-sm: 0 1px 2px rgba(60, 40, 20, .05);

    }



    html[data-theme="dark"] {

      color-scheme: dark;

      --bg: #0B0B0D;

      --sidebar: #111113;

      --sb-hover: rgba(255, 255, 255, .06);

      --sb-active: rgba(249, 115, 22, .15);

      --surface: #171719;

      --surface-2: #222225;

      --border: #29292D;

      --border-strong: #3A3A40;

      --text: #F5F5F5;

      --muted: #9999A3;

      --accent: #F97316;

      --accent-2: #FF9A45;

      --accent-ink: #FF9A45;

      --accent-soft: #382316;

      --user-bg: #302116;

      --code-bg: #101012;

      --code-head: #1C1C20;

      --code-text: #F5F5F5;

      --ring: rgba(249, 115, 22, .35);

      --glow: rgba(249, 115, 22, .12);

      --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 10px 32px rgba(0, 0, 0, .35);

      --shadow-sm: 0 1px 2px rgba(0, 0, 0, .3);

    }



    * { box-sizing: border-box; }

    html, body { margin: 0; height: 100%; }



    body {

      background: var(--bg);

      color: var(--text);

      font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;

      -webkit-font-smoothing: antialiased;

      transition: background .25s ease, color .25s ease;

      overflow: hidden;

    }



    button, textarea, input { font: inherit; color: inherit; }

    button { cursor: pointer; -webkit-tap-highlight-color: transparent; }

    svg.i { width: 1em; height: 1em; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex-shrink: 0; }

    :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 8px; }



    .layout { display: flex; height: 100dvh; }



    /* ================= SIDEBAR ================= */

    .sidebar {

      width: var(--sb-w);

      flex-shrink: 0;

      display: flex;

      flex-direction: column;

      background: var(--sidebar);

      border-right: 1px solid var(--border);

      transition: margin-left .25s ease, visibility 0s, background .25s;

      z-index: 30;

    }

    .sb-collapsed .sidebar { margin-left: calc(var(--sb-w) * -1); visibility: hidden; transition: margin-left .25s ease, visibility 0s .25s; }



    .sb-top { height: 64px; padding: 0 12px 0 16px; display: flex; align-items: center; justify-content: space-between; flex-shrink: 0; }



    .brand { display: flex; align-items: center; gap: 10px; color: var(--text); text-decoration: none; }

    .brand .logo { width: 30px; height: 30px; filter: drop-shadow(0 3px 8px rgba(234, 88, 12, .28)); }

    .wordmark { font-weight: 600; font-size: 18px; letter-spacing: -.02em; }

    .wordmark b { color: var(--accent); font-weight: 600; }



    .sb-icon {

      width: 34px; height: 34px;

      display: inline-grid; place-items: center;

      border: 0; border-radius: 9px;

      background: transparent;

      color: var(--muted);

      font-size: 18px;

      transition: background .15s, color .15s;

    }

    .sb-icon:hover { background: var(--sb-hover); color: var(--text); }

    .sb-icon svg { width: 18px; height: 18px; }



    .sb-nav { padding: 4px 10px 6px; }

    .sb-link {

      width: 100%;

      display: flex; align-items: center; gap: 12px;

      padding: 9px 10px;

      border: 0; border-radius: 10px;

      background: transparent;

      font-size: 14.5px; font-weight: 500;

      text-align: left;

      transition: background .15s;

    }

    .sb-link:hover { background: var(--sb-hover); }

    .sb-link .plus {

      width: 26px; height: 26px; border-radius: 8px;

      display: grid; place-items: center;

      background: linear-gradient(145deg, var(--accent-2), var(--accent));

      color: #fff;

      box-shadow: 0 3px 8px rgba(234, 88, 12, .3);

    }

    .sb-link .plus svg { width: 15px; height: 15px; stroke-width: 2.6; }



    .sb-search { margin: 4px 14px 6px; position: relative; }

    .sb-search svg { position: absolute; left: 11px; top: 50%; transform: translateY(-50%); width: 15px; height: 15px; color: var(--muted); pointer-events: none; }

    .sb-search input {

      width: 100%; height: 36px;

      padding: 0 12px 0 34px;

      border: 1px solid var(--border);

      border-radius: 10px;

      background: var(--surface);

      font-size: 13.5px;

      outline: none;

      transition: border-color .15s, box-shadow .15s;

    }

    .sb-search input::placeholder { color: var(--muted); }

    .sb-search input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--ring); }



    .sb-label { padding: 14px 20px 6px; font-size: 12px; font-weight: 600; letter-spacing: .04em; color: var(--muted); }



    .sb-list { flex: 1; min-height: 0; overflow-y: auto; padding: 0 10px 10px; scrollbar-width: thin; scrollbar-color: var(--border-strong) transparent; }

    .sb-empty { margin: 8px 10px; font-size: 13px; line-height: 1.55; color: var(--muted); }



    .chat-item { position: relative; display: flex; align-items: center; border-radius: 10px; transition: background .15s; }

    .chat-item:hover { background: var(--sb-hover); }

    .chat-item.active { background: var(--sb-active); }

    .chat-open {

      flex: 1; min-width: 0;

      padding: 9px 10px;

      border: 0; background: transparent;

      text-align: left;

      font-size: 14px;

      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;

      border-radius: 10px;

    }

    .chat-item.active .chat-open { font-weight: 500; }

    .chat-del {

      width: 28px; height: 28px; margin-right: 4px;

      display: none; place-items: center;

      border: 0; border-radius: 8px;

      background: transparent; color: var(--muted);

    }

    .chat-del svg { width: 15px; height: 15px; }

    .chat-del:hover { background: var(--sb-hover); color: #c2410c; }

    .chat-item:hover .chat-del, .chat-item:focus-within .chat-del { display: grid; }

    @media (hover: none) { .chat-del { display: grid; } }



    .sb-foot { padding: 10px; border-top: 1px solid var(--border); flex-shrink: 0; }

    .profile {

      width: 100%;

      display: flex; align-items: center; gap: 11px;

      padding: 8px 10px;

      border: 0; border-radius: 12px;

      background: transparent;

      text-align: left;

      transition: background .15s;

    }

    .profile:hover { background: var(--sb-hover); }

    .avatar { width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; background: linear-gradient(145deg, var(--accent-2), var(--accent)); color: #fff; font-weight: 600; font-size: 14px; flex-shrink: 0; }

    .pname { font-size: 14px; font-weight: 500; line-height: 1.2; }

    .psub { display: block; font-size: 11.5px; color: var(--muted); font-weight: 400; margin-top: 2px; }



    .scrim { display: none; }



    /* ================= PAGE ================= */

    .page { flex: 1; min-width: 0; height: 100dvh; display: flex; flex-direction: column; position: relative; isolation: isolate; }

    .page::before {

      content: "";

      position: absolute;

      inset: -20% 0 auto 0;

      height: 70vh;

      background: radial-gradient(ellipse 55% 60% at 50% 0%, var(--glow), transparent 70%);

      pointer-events: none;

      z-index: -1;

    }



    header {

      height: 64px;

      padding: 0 max(16px, env(safe-area-inset-right)) 0 max(16px, env(safe-area-inset-left));

      display: grid;

      grid-template-columns: 1fr auto 1fr;

      align-items: center;

      gap: 12px;

      flex-shrink: 0;

    }

    .hdr-left { display: none; align-items: center; gap: 8px; }

    .sb-collapsed .hdr-left { display: flex; }

    .hdr-left .logo { width: 28px; height: 28px; }

    .chat-title { font-size: 14.5px; font-weight: 500; max-width: min(46vw, 420px); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--muted); grid-column: 2; }

    .hdr-right { grid-column: 3; display: flex; justify-content: flex-end; }



    .btn {

      height: 38px;

      display: inline-flex; align-items: center; gap: 8px;

      padding: 0 14px;

      border: 1px solid var(--border);

      background: var(--surface);

      border-radius: 11px;

      font-size: 13.5px; font-weight: 500;

      box-shadow: var(--shadow-sm);

      transition: border-color .15s, transform .15s, background .15s, color .15s;

    }

    .btn:hover { border-color: var(--accent); color: var(--accent-ink); }

    .btn:active { transform: scale(.97); }

    .btn.icon { width: 38px; padding: 0; justify-content: center; }

    .btn.icon svg { width: 17px; height: 17px; }



    /* ---------- main stage ---------- */

    main {

      flex: 1;

      min-height: 0;

      width: 100%;

      max-width: 780px;

      margin: 0 auto;

      padding: 0 20px max(16px, env(safe-area-inset-bottom));

      display: flex;

      flex-direction: column;

    }

    main:not(.chatting) { justify-content: center; padding-bottom: 8vh; }



    .welcome { text-align: center; margin-bottom: 24px; animation: rise .6s ease both; }

    .welcome .logo { width: 60px; height: 60px; margin-bottom: 20px; filter: drop-shadow(0 10px 22px rgba(234, 88, 12, .32)); }

    .welcome h1 {

      font-family: 'Fraunces', Georgia, 'Times New Roman', serif;

      font-weight: 500;

      font-size: clamp(32px, 5.2vw, 46px);

      letter-spacing: -.02em;

      line-height: 1.15;

      margin: 0 0 10px;

    }

    .welcome h1 em { font-style: italic; color: var(--accent); }

    .welcome p { margin: 0; color: var(--muted); font-size: 15.5px; line-height: 1.6; }



    main.chatting .welcome, main.chatting .suggestions { display: none; }

    main:not(.chatting) #messages { display: none; }



    /* ---------- suggestions (sit ABOVE the composer) ---------- */

    .suggestions {

      margin: 0 0 16px;

      display: grid;

      grid-template-columns: repeat(2, 1fr);

      gap: 10px;

      animation: rise .8s ease both;

    }

    .chip {

      display: flex; align-items: flex-start; gap: 12px;

      text-align: left;

      padding: 14px 15px;

      border: 1px solid var(--border);

      background: var(--surface);

      border-radius: 14px;

      box-shadow: var(--shadow-sm);

      transition: transform .18s, border-color .18s, box-shadow .18s;

    }

    .chip:hover { transform: translateY(-2px); border-color: var(--accent); box-shadow: var(--shadow); }

    .chip .ic { width: 32px; height: 32px; border-radius: 9px; display: grid; place-items: center; background: var(--accent-soft); color: var(--accent-ink); font-size: 16px; flex-shrink: 0; }

    .chip strong { display: block; font-size: 13.5px; font-weight: 600; margin-bottom: 2px; }

    .chip span { font-size: 12.5px; color: var(--muted); line-height: 1.45; }



    /* ---------- messages ---------- */

    #messages {

      flex: 1;

      min-height: 0;

      overflow-y: auto;

      padding: 8px 4px 24px;

      display: flex;

      flex-direction: column;

      gap: 26px;

      scrollbar-width: thin;

      scrollbar-color: var(--border-strong) transparent;

      scroll-behavior: smooth;

    }



    .row { animation: rise .28s ease both; }

    .row.user { align-self: flex-end; max-width: 82%; }

    .row.user .bubble {

      background: var(--user-bg);

      padding: 11px 16px;

      border-radius: 18px 18px 5px 18px;

      font-size: 15px; line-height: 1.6;

      white-space: pre-wrap; overflow-wrap: anywhere;

    }



    .row.bot { display: grid; grid-template-columns: 30px 1fr; gap: 14px; align-items: start; max-width: 100%; }

    .row.bot .logo { width: 30px; height: 30px; margin-top: 1px; }

    .content { min-width: 0; font-size: 15.5px; line-height: 1.75; overflow-wrap: anywhere; }

    .content > :first-child { margin-top: 0; }

    .content > :last-child { margin-bottom: 0; }

    .content p { margin: 0 0 .85em; }

    .content ul, .content ol { margin: 0 0 .85em; padding-left: 1.4em; }

    .content li { margin: .25em 0; }

    .content li::marker { color: var(--accent); }

    .content h4 { margin: 1.1em 0 .4em; font-size: 15.5px; font-weight: 600; }

    .content strong { font-weight: 600; }

    .content code:not(pre code) {

      font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace;

      font-size: .87em;

      padding: .15em .45em;

      border-radius: 6px;

      background: var(--accent-soft);

      color: var(--accent-ink);

    }



    .code { margin: .4em 0 1em; border-radius: 12px; overflow: hidden; background: var(--code-bg); border: 1px solid var(--border); box-shadow: var(--shadow-sm); }

    .code-head { display: flex; align-items: center; justify-content: space-between; padding: 7px 8px 7px 14px; background: var(--code-head); color: #bfb2a4; font-size: 12px; letter-spacing: .02em; }

    .code pre { margin: 0; padding: 14px 16px; overflow-x: auto; scrollbar-width: thin; }

    .code pre code { font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace; font-size: 13.5px; line-height: 1.65; color: var(--code-text); white-space: pre; }



    .mini {

      display: inline-flex; align-items: center; gap: 6px;

      padding: 4px 9px;

      border: 0; border-radius: 8px;

      background: transparent; color: inherit;

      font-size: 12px;

      transition: background .15s, color .15s;

    }

    .mini:hover { background: rgba(255, 255, 255, .1); color: #fff; }

    .mini svg { width: 14px; height: 14px; }

    .mini.done { color: #7ee2a8; }



    .actions { margin-top: 8px; display: flex; gap: 4px; opacity: 0; transition: opacity .15s; }

    .row.bot:hover .actions, .row.bot:focus-within .actions { opacity: 1; }

    .actions .mini { color: var(--muted); }

    .actions .mini:hover { background: var(--surface-2); color: var(--text); }

    .actions .mini.done { color: #1f9d5b; }

    @media (hover: none) { .actions { opacity: 1; } }



    .typing { display: inline-flex; align-items: center; gap: 5px; padding: 10px 0; }

    .typing span { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); animation: pulse 1.1s infinite ease-in-out; }

    .typing span:nth-child(2) { animation-delay: .15s; }

    .typing span:nth-child(3) { animation-delay: .3s; }



    .error {

      display: flex; align-items: center; gap: 12px; flex-wrap: wrap;

      padding: 12px 14px;

      border: 1px solid #f3c9b4; background: #fff1e8; color: #8a3a12;

      border-radius: 12px; font-size: 14px; line-height: 1.5;

    }

    html[data-theme="dark"] .error { background: #3a2218; border-color: #5c3a28; color: #ffc9a8; }

    .error svg { width: 18px; height: 18px; }

    .error .msg { flex: 1; min-width: 180px; }

    .error .btn { height: 32px; font-size: 13px; padding: 0 12px; border-radius: 9px; }



    /* ---------- composer ---------- */

    .composer-area { flex-shrink: 0; }

    .composer {

      background: var(--surface);

      border: 1px solid var(--border);

      border-radius: 22px;

      padding: 14px 14px 10px 18px;

      box-shadow: var(--shadow);

      transition: border-color .2s, box-shadow .2s;

    }

    .composer:focus-within { border-color: var(--accent); box-shadow: 0 0 0 4px var(--ring), var(--shadow); }



    textarea { display: block; width: 100%; min-height: 28px; max-height: 180px; resize: none; border: 0; outline: 0; background: transparent; font-size: 15.5px; line-height: 1.6; padding: 0; }

    textarea::placeholder { color: var(--muted); }

    textarea:focus-visible { outline: none; }



    .composer-bar { display: flex; align-items: center; justify-content: flex-end; gap: 12px; margin-top: 8px; }

    .hint { font-size: 12px; color: var(--muted); margin-right: auto; }

    .composer-right { display: flex; align-items: center; gap: 10px; }

    .count { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }

    .count.warn { color: var(--accent-ink); font-weight: 600; }



    .send {

      width: 38px; height: 38px;

      display: grid; place-items: center;

      border: 0; border-radius: 12px;

      color: #fff;

      background: linear-gradient(145deg, var(--accent-2), var(--accent));

      box-shadow: 0 4px 12px rgba(234, 88, 12, .35);

      transition: transform .15s, box-shadow .15s, opacity .15s, filter .15s;

    }

    .send svg { width: 18px; height: 18px; stroke-width: 2.4; }

    .send:hover:not(:disabled) { transform: translateY(-1px); box-shadow: 0 7px 16px rgba(234, 88, 12, .4); }

    .send:active:not(:disabled) { transform: scale(.95); }

    .send:disabled { opacity: .4; box-shadow: none; cursor: not-allowed; filter: saturate(.6); }



    .note { text-align: center; color: var(--muted); font-size: 11.5px; padding: 10px 0 0; min-height: 28px; }



    @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

    @keyframes pulse { 0%, 80%, 100% { opacity: .3; transform: scale(.8); } 40% { opacity: 1; transform: scale(1); } }



    /* ================= MOBILE: sidebar becomes a drawer ================= */

    @media (max-width: 800px) {

      .sidebar, .sb-collapsed .sidebar {

        position: fixed; top: 0; bottom: 0; left: 0;

        width: min(86vw, 320px);

        margin-left: 0;

        visibility: visible;

        transform: translateX(-100%);

        transition: transform .25s ease;

        box-shadow: none;

      }

      body.sb-open .sidebar { transform: none; box-shadow: 0 0 40px rgba(0, 0, 0, .25); }

      .scrim { display: block; position: fixed; inset: 0; background: rgba(20, 12, 6, .45); opacity: 0; pointer-events: none; transition: opacity .25s; z-index: 20; }

      body.sb-open .scrim { opacity: 1; pointer-events: auto; }

      .hdr-left, .sb-collapsed .hdr-left { display: flex; }

      header { height: 56px; }

      .hdr-left .logo { display: none; }

    }



    @media (max-width: 600px) {

      main { padding-left: 14px; padding-right: 14px; }

      main:not(.chatting) { justify-content: flex-start; padding-top: 4vh; }

      .welcome .logo { width: 52px; height: 52px; margin-bottom: 16px; }

      .suggestions { grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 12px; }

      .chip { padding: 11px; gap: 9px; align-items: center; }

      .chip span { display: none; }

      .chip strong { margin: 0; font-size: 13px; }

      .hint { display: none; }

      .row.user { max-width: 92%; }

      .row.bot { grid-template-columns: 26px 1fr; gap: 10px; }

      .row.bot .logo { width: 26px; height: 26px; }

    }



    @media (prefers-reduced-motion: reduce) {

      *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; scroll-behavior: auto !important; }

    }

  </style>

</head>



<body>

  <!-- Logo: a speech bubble holding a four-point spark (original mark) -->

  <svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">

    <defs>

      <linearGradient id="cv-g" x1="0" y1="0" x2="1" y2="1">

        <stop offset="0" stop-color="#ffa24d"/>

        <stop offset="1" stop-color="#ea580c"/>

      </linearGradient>

      <symbol id="cv-logo" viewBox="0 0 48 48">

        <rect width="48" height="48" rx="13" fill="url(#cv-g)"/>

        <path fill="#fff" d="M18 11H30A8 8 0 0 1 38 19V24A8 8 0 0 1 30 32H25L18 38V32A8 8 0 0 1 10 24V19A8 8 0 0 1 18 11Z"/>

        <path fill="#ea580c" d="M24 14.5C24.6 18.6 26.9 20.9 31 21.5C26.9 22.1 24.6 24.4 24 28.5C23.4 24.4 21.1 22.1 17 21.5C21.1 20.9 23.4 18.6 24 14.5Z"/>

      </symbol>

    </defs>

  </svg>



  <div class="layout">

    <!-- ============ SIDEBAR ============ -->

    <aside class="sidebar" id="sidebar" aria-label="Chat history">

      <div class="sb-top">

        <a class="brand" href="/" aria-label="ConvoAI home">

          <svg class="logo" aria-hidden="true"><use href="#cv-logo"/></svg>

          <span class="wordmark">Convo<b>AI</b></span>

        </a>

        <button class="sb-icon" id="collapseBtn" type="button" aria-label="Close sidebar" title="Close sidebar" data-icon="panel"></button>

      </div>



      <nav class="sb-nav">

        <button class="sb-link" id="newChat" type="button">

          <span class="plus" data-icon="plus"></span><span>New chat</span>

        </button>

      </nav>



      <div class="sb-search">

        <span data-icon="search"></span>

        <input id="searchChats" type="search" placeholder="Search chats" aria-label="Search chats" autocomplete="off">

      </div>



      <div class="sb-label">Recents</div>

      <div class="sb-list" id="chatList" role="list"></div>



      <div class="sb-foot">

        <button class="profile" id="profileBtn" type="button" title="Click to set your name">

          <span class="avatar" id="avatar">G</span>

          <span class="pname"><span id="pname">Guest</span><span class="psub">Powered by Google Gemini</span></span>

        </button>

      </div>

    </aside>

    <div class="scrim" id="scrim"></div>



    <!-- ============ PAGE ============ -->

    <div class="page">

      <header>

        <div class="hdr-left">

          <button class="btn icon" id="openBtn" type="button" aria-label="Open sidebar" title="Open sidebar" data-icon="panel"></button>

          <svg class="logo" aria-hidden="true"><use href="#cv-logo"/></svg>

        </div>

        <div class="chat-title" id="chatTitle"></div>

        <div class="hdr-right">

          <button class="btn icon" id="themeToggle" type="button" aria-label="Toggle theme" title="Switch theme"></button>

        </div>

      </header>



      <main id="stage">

        <section class="welcome" id="welcome">

          <svg class="logo" aria-hidden="true"><use href="#cv-logo"/></svg>

          <h1 id="greeting">Hello</h1>

          <p>Think freely. Ask anything. Discover something new.</p>

        </section>



        <!-- suggestions come BEFORE the composer -->

        <section class="suggestions" id="suggestions" aria-label="Conversation starters">

          <button class="chip" type="button" data-prompt="Explain artificial intelligence in simple terms with real-world examples.">

            <div class="ic" data-icon="spark"></div>

            <div><strong>Explore AI</strong><span>Understand big ideas in simple language.</span></div>

          </button>

          <button class="chip" type="button" data-prompt="Give me five creative project ideas for a computer science student.">

            <div class="ic" data-icon="bulb"></div>

            <div><strong>Get inspired</strong><span>Turn ideas into real projects.</span></div>

          </button>

          <button class="chip" type="button" data-prompt="Teach me Python programming with a beginner-friendly example.">

            <div class="ic" data-icon="code"></div>

            <div><strong>Learn to code</strong><span>Build skills one step at a time.</span></div>

          </button>

          <button class="chip" type="button" data-prompt="Help me plan a productive and balanced study schedule.">

            <div class="ic" data-icon="calendar"></div>

            <div><strong>Plan your day</strong><span>Organise your goals and next steps.</span></div>

          </button>

        </section>



        <section id="messages" aria-live="polite" aria-label="Conversation"></section>



        <section class="composer-area">

          <form class="composer" id="composerForm" autocomplete="off">

            <textarea id="messageInput" rows="1" maxlength="4000" placeholder="Ask ConvoAI anything…" aria-label="Write your message"></textarea>

            <div class="composer-bar">

              <span class="hint">Enter to send · Shift + Enter for a new line</span>

              <div class="composer-right">

                <span class="count" id="count" aria-live="off"></span>

                <button class="send" id="sendButton" type="submit" aria-label="Send message" title="Send" disabled data-icon="up"></button>

              </div>

            </div>

          </form>

          <div class="note" id="status">ConvoAI can make mistakes. Please double-check important information.</div>

        </section>

      </main>

    </div>

  </div>



  <script>

    // ---------- icons (inline SVG, no external dependency) ----------

    const ICONS = {

      plus: '<path d="M12 5v14M5 12h14"/>',

      up: '<path d="M12 19V5"/><path d="m5 12 7-7 7 7"/>',

      moon: '<path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>',

      sun: '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>',

      copy: '<rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>',

      check: '<path d="M20 6 9 17l-5-5"/>',

      retry: '<path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/>',

      alert: '<circle cx="12" cy="12" r="10"/><path d="M12 8v4M12 16h.01"/>',

      spark: '<path d="M12 3l1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9z"/>',

      bulb: '<path d="M15 14c.2-1 .7-1.7 1.5-2.5 1-.9 1.5-2.2 1.5-3.5A6 6 0 0 0 6 8c0 1 .2 2.2 1.5 3.5.7.7 1.3 1.5 1.5 2.5"/><path d="M9 18h6M10 22h4"/>',

      code: '<path d="m16 18 6-6-6-6M8 6l-6 6 6 6"/>',

      calendar: '<rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/>',

      panel: '<rect x="3" y="4" width="18" height="16" rx="3"/><path d="M9 4v16"/>',

      search: '<circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/>',

      trash: '<path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v6M14 11v6"/>'

    };

    const icon = (name) => `<svg class="i" viewBox="0 0 24 24" aria-hidden="true">${ICONS[name]}</svg>`;

    document.querySelectorAll("[data-icon]").forEach(el => { el.innerHTML = icon(el.dataset.icon); });



    // ---------- elements & state ----------

    const $ = (id) => document.getElementById(id);

    const stage = $("stage"), messages = $("messages"), input = $("messageInput");

    const form = $("composerForm"), sendButton = $("sendButton"), statusEl = $("status");

    const countEl = $("count"), themeToggle = $("themeToggle"), chatList = $("chatList");

    const searchInput = $("searchChats"), chatTitle = $("chatTitle");

    const DEFAULT_NOTE = "ConvoAI can make mistakes. Please double-check important information.";

    const MAX_CHARS = 4000, MAX_CHATS = 60;

    const STORE_KEY = "convoai-chats-v1", NAME_KEY = "convoai-name";

    const mobileMQ = window.matchMedia("(max-width: 800px)");

    const canHover = window.matchMedia("(hover: hover)").matches;



    let chats = loadChats();      // saved chats: [{id, title, updated, messages:[{role:"user"|"bot", text}]}]

    let currentId = makeId();     // id of the chat on screen (also the server-side conversation id)

    let transcript = [];          // messages of the chat on screen

    const live = new Set();       // conversation ids the server is known to hold this session

    let sending = false;



    function makeId() {

      try { return crypto.randomUUID().replace(/-/g, ""); }

      catch (e) { return Array.from({ length: 32 }, () => Math.floor(Math.random() * 16).toString(16)).join(""); }

    }



    // ---------- local storage (always wrapped: it can be blocked or full) ----------

    function loadChats() {

      try {

        const arr = JSON.parse(localStorage.getItem(STORE_KEY) || "[]");

        return Array.isArray(arr) ? arr.filter(c => c && c.id && Array.isArray(c.messages)) : [];

      } catch (e) { return []; }

    }

    function saveChats() {

      chats.sort((a, b) => b.updated - a.updated);

      chats = chats.slice(0, MAX_CHATS);

      for (let i = 0; i < 5; i++) {

        try { localStorage.setItem(STORE_KEY, JSON.stringify(chats)); return; }

        catch (e) { if (chats.length <= 1) return; chats.pop(); }   // quota: drop the oldest and retry

      }

    }

    const getName = () => { try { return (localStorage.getItem(NAME_KEY) || "").trim(); } catch (e) { return ""; } };



    // ---------- greeting & profile ----------

    function paintProfile() {

      const name = getName();

      $("pname").textContent = name || "Guest";

      $("avatar").textContent = (name || "G").charAt(0).toUpperCase();

      const h = new Date().getHours();

      const hello = h < 5 ? "Burning the midnight oil" : h < 12 ? "Good morning" : h < 17 ? "Good afternoon" : "Good evening";

      const g = $("greeting");

      g.textContent = hello + ", ";

      const em = document.createElement("em");

      em.textContent = name ? name + "." : "let's talk.";

      g.appendChild(em);

    }

    $("profileBtn").addEventListener("click", () => {

      const n = prompt("What should ConvoAI call you?", getName());

      if (n === null) return;

      try { localStorage.setItem(NAME_KEY, n.trim().slice(0, 30)); } catch (e) {}

      paintProfile();

    });

    paintProfile();



    // ---------- theme ----------

    function paintTheme() {

      const dark = document.documentElement.dataset.theme === "dark";

      themeToggle.innerHTML = icon(dark ? "sun" : "moon");

      themeToggle.title = dark ? "Switch to light theme" : "Switch to dark theme";

      document.querySelector('meta[name="theme-color"]').content = dark ? "#0B0B0D" : "#faf7f2";

    }

    themeToggle.addEventListener("click", () => {

      const next = document.documentElement.dataset.theme === "dark" ? "light" : "dark";

      document.documentElement.dataset.theme = next;

      try { localStorage.setItem("convoai-theme-v2", next); } catch (e) {}

      paintTheme();

    });

    paintTheme();



    // ---------- sidebar open / close ----------

    // Desktop: the "sb-collapsed" class lives on <html> (set before first paint, remembered).

    // Mobile: the sidebar is a drawer toggled by "sb-open" on <body>.

    const root = document.documentElement;

    function setCollapsed(c) {

      root.classList.toggle("sb-collapsed", c);

      try { localStorage.setItem("convoai-sidebar", c ? "collapsed" : "open"); } catch (e) {}

    }

    function openSidebar() { mobileMQ.matches ? document.body.classList.add("sb-open") : setCollapsed(false); }

    function closeSidebar() { mobileMQ.matches ? document.body.classList.remove("sb-open") : setCollapsed(true); }

    $("openBtn").addEventListener("click", openSidebar);

    $("collapseBtn").addEventListener("click", closeSidebar);

    $("scrim").addEventListener("click", () => document.body.classList.remove("sb-open"));

    document.addEventListener("keydown", (e) => { if (e.key === "Escape") document.body.classList.remove("sb-open"); });



    // ---------- sidebar: recents list ----------

    function renderSidebar() {

      const q = searchInput.value.trim().toLowerCase();

      const list = chats

        .filter(c => !q || c.title.toLowerCase().includes(q))

        .sort((a, b) => b.updated - a.updated);

      chatList.textContent = "";

      if (!list.length) {

        const p = document.createElement("p");

        p.className = "sb-empty";

        p.textContent = q ? "No chats match your search." : "Your conversations will appear here.";

        chatList.appendChild(p);

        return;

      }

      for (const c of list) {

        const item = document.createElement("div");

        item.className = "chat-item" + (c.id === currentId ? " active" : "");

        item.setAttribute("role", "listitem");



        const open = document.createElement("button");

        open.type = "button";

        open.className = "chat-open";

        open.textContent = c.title;

        open.title = c.title;

        open.addEventListener("click", () => openChat(c.id));



        const del = document.createElement("button");

        del.type = "button";

        del.className = "chat-del";

        del.title = "Delete chat";

        del.setAttribute("aria-label", "Delete chat: " + c.title);

        del.innerHTML = icon("trash");

        del.addEventListener("click", (e) => { e.stopPropagation(); deleteChat(c.id); });



        item.append(open, del);

        chatList.appendChild(item);

      }

    }

    searchInput.addEventListener("input", renderSidebar);



    function makeTitle(text) {

      const t = text.replace(/\s+/g, " ").trim();

      return t.length > 48 ? t.slice(0, 47).trimEnd() + "…" : t;

    }



    function persistCurrent() {

      if (!transcript.length) return;

      let chat = chats.find(c => c.id === currentId);

      if (!chat) {

        const firstUser = transcript.find(m => m.role === "user");

        chat = { id: currentId, title: makeTitle(firstUser ? firstUser.text : "New chat"), updated: 0, messages: [] };

        chats.push(chat);

      }

      chat.messages = transcript.slice();

      chat.updated = Date.now();

      chatTitle.textContent = chat.title;

      saveChats();

      renderSidebar();

    }



    // ---------- safe, tiny markdown renderer (escapes HTML first) ----------

    const esc = (s) => s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");



    function inline(s) {
      return s
        .replace(/`([^`\n]+)`/g, "<code>$1</code>")
        .replace(/\*\*([^*\n]+)\*\*/g, "<strong>$1</strong>")
        .replace(/\*([^*\n]+)\*/g, "<em>$1</em>");
    }

    function blocks(text) {

      const out = [];

      let para = [], list = null;

      const flushPara = () => { if (para.length) { out.push("<p>" + para.join("<br>") + "</p>"); para = []; } };

      const flushList = () => {

        if (!list) return;

        const start = list.t === "ol" && list.start > 1 ? ` start="${list.start}"` : "";

        out.push(`<${list.t}${start}>` + list.items.map(i => `<li>${i}</li>`).join("") + `</${list.t}>`);

        list = null;

      };

      for (const raw of text.split("\n")) {

        const line = raw.trimEnd();

        let m;

        if (!line.trim()) { flushPara(); flushList(); }

        else if ((m = line.match(/^\s*[-*•]\s+(.*)$/))) {

          flushPara();

          if (!list || list.t !== "ul") { flushList(); list = { t: "ul", items: [] }; }

          list.items.push(inline(esc(m[1])));

        } else if ((m = line.match(/^\s*(\d+)[.)]\s+(.*)$/))) {

          flushPara();

          if (!list || list.t !== "ol") { flushList(); list = { t: "ol", items: [], start: parseInt(m[1], 10) }; }

          list.items.push(inline(esc(m[2])));

        } else if ((m = line.match(/^#{1,4}\s+(.*)$/))) {

          flushPara(); flushList();

          out.push("<h4>" + inline(esc(m[1])) + "</h4>");

        } else { flushList(); para.push(inline(esc(line))); }

      }

      flushPara(); flushList();

      return out.join("");

    }



    function renderMarkdown(text) {

      return text.split("```").map((part, i) => {

        if (i % 2 === 0) return blocks(part);

        let lang = "", code = part;

        const nl = part.indexOf("\n");

        if (nl !== -1 && /^[\w+#.-]*$/.test(part.slice(0, nl).trim())) {

          lang = part.slice(0, nl).trim();

          code = part.slice(nl + 1);

        }

        return `<div class="code"><div class="code-head"><span>${esc(lang) || "code"}</span>` +

          `<button class="mini copy-code" type="button">${icon("copy")}<span>Copy</span></button></div>` +

          `<pre><code>${esc(code.replace(/\n$/, ""))}</code></pre></div>`;

      }).join("");

    }



    // ---------- clipboard ----------

    async function copyText(text) {

      try { await navigator.clipboard.writeText(text); return true; }

      catch (e) {

        const ta = document.createElement("textarea");

        ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0";

        document.body.appendChild(ta); ta.select();

        let ok = false;

        try { ok = document.execCommand("copy"); } catch (_) {}

        ta.remove();

        return ok;

      }

    }

    function flashCopied(btn) {

      const original = btn.innerHTML;

      btn.classList.add("done");

      btn.innerHTML = `${icon("check")}<span>Copied</span>`;

      setTimeout(() => { btn.classList.remove("done"); btn.innerHTML = original; }, 1600);

    }

    messages.addEventListener("click", async (e) => {

      const codeBtn = e.target.closest(".copy-code");

      if (codeBtn) {

        if (await copyText(codeBtn.closest(".code").querySelector("code").textContent)) flashCopied(codeBtn);

        return;

      }

      const msgBtn = e.target.closest(".copy-msg");

      if (msgBtn && await copyText(msgBtn.closest(".row")._raw || "")) flashCopied(msgBtn);

    });



    // ---------- row builders ----------

    function scrollDown() { messages.scrollTop = messages.scrollHeight; }



    function addUser(text) {

      const row = document.createElement("div");

      row.className = "row user";

      const b = document.createElement("div");

      b.className = "bubble";

      b.textContent = text;

      row.appendChild(b);

      messages.appendChild(row);

      scrollDown();

      return row;

    }



    function botRow(innerHtml) {

      const row = document.createElement("div");

      row.className = "row bot";

      row.innerHTML = '<svg class="logo" aria-hidden="true"><use href="#cv-logo"/></svg><div class="content"></div>';

      row.querySelector(".content").innerHTML = innerHtml;

      return row;

    }



    function addTyping() {

      const row = botRow('<div class="typing" role="status" aria-label="ConvoAI is thinking"><span></span><span></span><span></span></div>');

      messages.appendChild(row);

      scrollDown();

      return row;

    }



    function fillReply(row, text) {

      row._raw = text;

      row.querySelector(".content").innerHTML = renderMarkdown(text) +

        `<div class="actions"><button class="mini copy-msg" type="button">${icon("copy")}<span>Copy</span></button></div>`;

      scrollDown();

    }



    function addBot(text) {

      const row = botRow("");

      messages.appendChild(row);

      fillReply(row, text);

    }



    function fillError(row, message, retryText) {

      const c = row.querySelector(".content");

      c.innerHTML = `<div class="error" role="alert">${icon("alert")}<span class="msg"></span>` +

        `<button class="btn retry" type="button">${icon("retry")}<span>Try again</span></button></div>`;

      c.querySelector(".msg").textContent = message;

      c.querySelector(".retry").addEventListener("click", () => { row.remove(); ask(retryText, false); });

      scrollDown();

    }



    // ---------- talking to the FastAPI backend ----------

    async function api(path, body, signal) {

      const res = await fetch(path, {

        method: "POST",

        headers: { "Content-Type": "application/json" },

        body: JSON.stringify(body),

        signal

      });

      let data = {};

      try { data = await res.json(); } catch (_) {}

      if (!res.ok) throw new Error(data.error || "Something went wrong. Please try again.");

      return data;

    }



    function setBusy(b) { sending = b; updateSendState(); }



    async function ask(text, addBubble = true) {

      if (sending) return;

      setBusy(true);

      stage.classList.add("chatting");

      transcript.push({ role: "user", text });

      if (addBubble) addUser(text);

      const row = addTyping();

      statusEl.textContent = "ConvoAI is thinking…";



      const controller = new AbortController();

      const timer = setTimeout(() => controller.abort(), 60000);

      try {

const data = await api("/api/chat", { message: text, conversation_id: currentId }, controller.signal);

        live.add(currentId);

        transcript.push({ role: "bot", text: data.reply });

        fillReply(row, data.reply);

        persistCurrent();

        const n = Number(data.messages_in_context) || 0;

        statusEl.textContent = `${n} message${n === 1 ? "" : "s"} in context` + (data.has_summary ? " · earlier messages summarised" : "");

      } catch (err) {

        transcript.pop();   // the failed question isn't part of the conversation

        const msg = err.name === "AbortError"

          ? "That took too long. Please try again."

          : err instanceof TypeError

            ? "Can't reach the server. Check that it's running and try again."

            : err.message;

        fillError(row, msg, text);

        statusEl.textContent = DEFAULT_NOTE;

      } finally {

        clearTimeout(timer);

        setBusy(false);

        if (canHover) input.focus();

      }

    }



    // ---------- chats: new / open / delete ----------

    function showEmptyState() {

      messages.innerHTML = "";

      stage.classList.remove("chatting");

      chatTitle.textContent = "";

      statusEl.textContent = DEFAULT_NOTE;

      paintProfile();

    }



    function newChat() {

      if (sending) return;

      currentId = makeId();

      transcript = [];

      showEmptyState();

      input.value = "";

      autosize();

      updateSendState();

      renderSidebar();

      if (mobileMQ.matches) document.body.classList.remove("sb-open");

      input.focus();

    }



    function openChat(id) {

      if (sending) return;

      if (mobileMQ.matches) document.body.classList.remove("sb-open");

      if (id === currentId) return;

      const chat = chats.find(c => c.id === id);

      if (!chat) return;

      currentId = id;

      transcript = chat.messages.slice();

      messages.innerHTML = "";

      stage.classList.add("chatting");

      for (const m of transcript) { m.role === "user" ? addUser(m.text) : addBot(m.text); }

      chatTitle.textContent = chat.title;

      statusEl.textContent = DEFAULT_NOTE;

      renderSidebar();

      scrollDown();

      if (canHover) input.focus();

    }



    function deleteChat(id) {

      if (sending) return;

      const chat = chats.find(c => c.id === id);

      if (!chat || !confirm(`Delete "${chat.title}"?`)) return;

      chats = chats.filter(c => c.id !== id);

      saveChats();

      live.delete(id);

      fetch("/api/reset", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ conversation_id: id }) }).catch(() => {});

      if (id === currentId) newChat(); else renderSidebar();

    }



    $("newChat").addEventListener("click", newChat);



    // ---------- composer behaviour ----------

    function updateSendState() {

      sendButton.disabled = sending || input.value.trim().length === 0;

      const n = input.value.length;

      countEl.textContent = n > MAX_CHARS * 0.8 ? `${n.toLocaleString()} / ${MAX_CHARS.toLocaleString()}` : "";

      countEl.classList.toggle("warn", n > MAX_CHARS * 0.95);

    }

    function autosize() {

      input.style.height = "auto";

      input.style.height = Math.min(input.scrollHeight, 180) + "px";

    }

    function submit() {

      const text = input.value.trim();

      if (!text || sending) return;

      input.value = "";

      autosize();

      updateSendState();

      ask(text);

    }



    form.addEventListener("submit", (e) => { e.preventDefault(); submit(); });

    input.addEventListener("keydown", (e) => {

      if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); submit(); }

    });

    input.addEventListener("input", () => { autosize(); updateSendState(); });

    document.querySelectorAll(".chip").forEach(chip => {

      chip.addEventListener("click", () => ask(chip.dataset.prompt));

    });



    // ---------- init ----------

    renderSidebar();

    updateSendState();

    if (canHover) input.focus();

  </script>

</body>

    async function openChat(id) {
      if (sending) return;
      if (mobileMQ.matches) document.body.classList.remove("sb-open");
      if (id === currentId && transcript.length) return;
      stopSpeech();

      stage.classList.add("chatting");
      messages.innerHTML = '<div class="loading-chat" role="status"><div class="typing"><span></span><span></span><span></span></div><span>Loading conversation…</span></div>';

      try {
        const res = await fetch(`/api/conversations/${encodeURIComponent(id)}`);
        if (!res.ok) {
          showEmptyState();
          showToast("Could not load conversation.", "err");
          return;
        }
        const data = await res.json();

        currentId = id;
        currentSummary = data.conversation?.summary || "";
        currentConvSettings = {
          custom_instructions: data.conversation?.custom_instructions || "",
          personality: data.conversation?.personality || "",
          response_length: data.conversation?.response_length || "",
          response_tone: data.conversation?.response_tone || ""
        };
        currentContextCount = Number(data.messages_in_context) || 0;
        transcript = (data.messages || []).map((m) => ({
          role: m.role === "user" ? "user" : "model",
          text: m.content,
          attachments: Array.isArray(m.attachments) ? m.attachments : []
        }));

        messages.innerHTML = "";
        stage.classList.toggle("chatting", transcript.length > 0);
        for (const m of transcript) {
          m.role === "user" ? addUser(m.text, m.attachments) : addBot(m.text);
        }

        chatTitle.textContent = data.conversation?.title || "";
        updateHeaderActions();
        updateStatusBar();
        renderSidebar();
        scrollDown();
        if (canHover) input.focus();
      } catch (_) {
        showEmptyState();
        checkConnection();
        showToast("Failed to reach server while loading chat.", "err", { label: "Retry", onClick: () => openChat(id) });
      }
    }

    function renameChat(c) {
      if (sending) return;
      openPromptModal({
        title: "Rename conversation",
        placeholder: "Enter conversation title",
        initialValue: c.title,
        submitLabel: "Rename",
        maxLength: 80,
        onSubmit: async (newTitle) => {
          const cleaned = newTitle.trim();
          if (!cleaned) return;
          const res = await fetch(`/api/conversations/${encodeURIComponent(c.id)}`, {
            method: "PATCH",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ title: cleaned })
          });
          if (res.ok) {
            if (c.id === currentId) chatTitle.textContent = cleaned;
            await refreshConversations();
          }
        }
      });
    }

    function deleteChat(c) {
      if (sending) return;
      openConfirmModal({
        title: "Delete conversation?",
        description: `"${c.title}" and its saved memory will be permanently deleted.`,
        confirmLabel: "Delete",
        onConfirm: async () => {
          await fetch(`/api/conversations/${encodeURIComponent(c.id)}`, { method: "DELETE" }).catch(() => {});
          if (c.id === currentId) {
            await refreshConversations();
            newChat();
          } else {
            await refreshConversations();
          }
          showToast("Conversation deleted.", "ok");
        }
      });
    }

    $("newChat").addEventListener("click", newChat);

    // ---------- attachments (images, PDFs, text/code documents) ----------
    function renderAttachments() {
      attStrip.textContent = "";
      attStrip.hidden = pendingAttachments.length === 0;
      pendingAttachments.forEach((att, idx) => {
        const chip = document.createElement("div");
        chip.className = "att-chip";
        if (att.kind === "image" && att.data) {
          const img = document.createElement("img");
          img.src = `data:${att.mimeType};base64,${att.data}`;
          img.alt = att.name;
          chip.appendChild(img);
        } else {
          const ic = document.createElement("span");
          ic.innerHTML = icon("file");
          chip.appendChild(ic);
        }
        const nm = document.createElement("span");
        nm.className = "att-chip-name";
        nm.textContent = att.name;
        const rm = document.createElement("button");
        rm.type = "button";
        rm.className = "att-chip-rm";
        rm.setAttribute("aria-label", `Remove ${att.name}`);
        rm.innerHTML = icon("close");
        rm.addEventListener("click", () => {
          pendingAttachments.splice(idx, 1);
          renderAttachments();
          updateSendState();
        });
        chip.append(nm, rm);
        attStrip.appendChild(chip);
      });
    }

    function readAsDataURL(file) {
      return new Promise((resolve, reject) => {
        const r = new FileReader();
        r.onload = () => resolve(String(r.result || ""));
        r.onerror = () => reject(new Error("Could not read file."));
        r.readAsDataURL(file);
      });
    }

    async function processImageFile(file) {
      const dataUrl = await readAsDataURL(file);
      let mimeType = file.type || "image/png";
      let base64 = dataUrl.split(",")[1] || "";

      if (file.size > 1.5 * 1024 * 1024 && mimeType !== "image/gif") {
        // Compress oversized raster images cleanly using canvas while preserving aspect ratio
        const img = new Image();
        await new Promise((resolve, reject) => {
          img.onload = resolve;
          img.onerror = reject;
          img.src = dataUrl;
        });
        const maxDim = 1600;
        let w = img.naturalWidth, h = img.naturalHeight;
        if (w > maxDim || h > maxDim) {
          const ratio = Math.min(maxDim / w, maxDim / h);
          w = Math.round(w * ratio);
          h = Math.round(h * ratio);
        }
        const canvas = document.createElement("canvas");
        canvas.width = w;
        canvas.height = h;
        canvas.getContext("2d").drawImage(img, 0, 0, w, h);
        const compressedUrl = canvas.toDataURL("image/jpeg", 0.85);
        mimeType = "image/jpeg";
        base64 = compressedUrl.split(",")[1] || "";
      }

      if (base64.length > 5_600_000) {
        throw new Error(`Image "${file.name}" exceeds the 4 MB limit even after compression.`);
      }
      return { kind: "image", name: file.name, mimeType, data: base64 };
    }

    const TEXT_EXTENSIONS = new Set(["txt", "md", "json", "csv", "js", "ts", "tsx", "jsx", "py", "html", "css", "sql", "xml", "yaml", "yml", "log"]);

    async function handleFiles(files) {
      if (!files || !files.length) return;
      for (const file of files) {
        if (pendingAttachments.length >= MAX_ATTACHMENTS) {
          showToast(`Maximum ${MAX_ATTACHMENTS} attachments per message.`, "err");
          break;
        }
        try {
          const ext = (file.name.split(".").pop() || "").toLowerCase();
          if (file.type.startsWith("image/") && ["image/png", "image/jpeg", "image/webp", "image/gif"].includes(file.type)) {
            pendingAttachments.push(await processImageFile(file));
          } else if (file.type === "application/pdf" || ext === "pdf") {
            if (file.size > 4 * 1024 * 1024) {
              throw new Error(`PDF "${file.name}" exceeds the 4 MB limit.`);
            }
            const dataUrl = await readAsDataURL(file);
            const base64 = dataUrl.split(",")[1] || "";
            pendingAttachments.push({ kind: "pdf", name: file.name, mimeType: "application/pdf", data: base64 });
          } else if (file.type.startsWith("text/") || TEXT_EXTENSIONS.has(ext) || file.type === "application/json") {
            if (file.size > 250 * 1024) {
              throw new Error(`Document "${file.name}" exceeds the 250 KB limit.`);
            }
            const textContent = await file.text();
            pendingAttachments.push({
              kind: "text",
              name: file.name,
              mimeType: file.type || "text/plain",
              textContent
            });
          } else {
            throw new Error(`Unsupported file "${file.name}". Use PNG/JPEG/WEBP/GIF, PDF, or text/code files.`);
          }
        } catch (err) {
          showToast(err.message || "Could not attach file.", "err");
        }
      }
      renderAttachments();
      updateSendState();
      fileInput.value = "";
    }

    attachBtn.addEventListener("click", () => { if (!sending) fileInput.click(); });
    fileInput.addEventListener("change", () => handleFiles(fileInput.files));
    form.addEventListener("dragover", (e) => { e.preventDefault(); form.classList.add("drag-over"); });
    form.addEventListener("dragleave", () => form.classList.remove("drag-over"));
    form.addEventListener("drop", (e) => {
      e.preventDefault();
      form.classList.remove("drag-over");
      if (!sending && e.dataTransfer?.files?.length) handleFiles(e.dataTransfer.files);
    });
    input.addEventListener("paste", (e) => {
      const items = e.clipboardData?.items;
      if (!items) return;
      const files = [];
      for (const item of items) {
        if (item.kind === "file") {
          const f = item.getAsFile();
          if (f) files.push(f);
        }
      }
      if (files.length) {
        e.preventDefault();
        handleFiles(files);
      }
    });

    // ---------- voice input (feature-detected Web Speech API) ----------
    if (SpeechRec) {
      const voiceBtn = document.createElement("button");
      voiceBtn.type = "button";
      voiceBtn.id = "voiceBtn";
      voiceBtn.className = "tool-btn";
      voiceBtn.setAttribute("aria-label", "Voice dictation");
      voiceBtn.title = "Voice input";
      voiceBtn.innerHTML = icon("mic");
      composerTools.appendChild(voiceBtn);

      const stopVoice = () => {
        if (recognition && isListening) {
          try { recognition.stop(); } catch (_) {}
        }
        isListening = false;
        voiceBtn.classList.remove("listening");
        voiceBtn.title = "Voice input";
      };

      voiceBtn.addEventListener("click", () => {
        if (sending) return;
        if (isListening) {
          stopVoice();
          return;
        }
        recognition = new SpeechRec();
        recognition.continuous = true;
        recognition.interimResults = false;
        recognition.lang = navigator.language || "en-US";
        recognition.onstart = () => {
          isListening = true;
          voiceBtn.classList.add("listening");
          voiceBtn.title = "Listening… click to stop";
        };
        recognition.onresult = (ev) => {
          let spoken = "";
          for (let i = ev.resultIndex; i < ev.results.length; i++) {
            if (ev.results[i].isFinal) spoken += ev.results[i][0].transcript + " ";
          }
          if (spoken.trim()) {
            input.value = (input.value ? input.value.trimEnd() + " " : "") + spoken.trim();
            autosize();
            updateSendState();
          }
        };
        recognition.onerror = (ev) => {
          stopVoice();
          if (ev.error !== "aborted") {
            showToast(`Voice input unavailable (${ev.error || "permission denied"}).`, "err");
          }
        };
        recognition.onend = () => { stopVoice(); };
        try { recognition.start(); } catch (_) { stopVoice(); showToast("Could not start microphone.", "err"); }
      });
    }

    // ---------- composer behaviour ----------
    function updateSendState() {
      if (sending) return;
      sendButton.disabled = input.value.trim().length === 0 && pendingAttachments.length === 0;
      const n = input.value.length;
      countEl.textContent = n > MAX_CHARS * 0.8 ? `${n.toLocaleString()} / ${MAX_CHARS.toLocaleString()}` : "";
      countEl.classList.toggle("warn", n > MAX_CHARS * 0.95);
    }

    function autosize() {
      input.style.height = "auto";
      input.style.height = Math.min(input.scrollHeight, 180) + "px";
    }

    function submit() {
      const text = input.value.trim();
      if ((!text && pendingAttachments.length === 0) || sending) return;
      input.value = "";
      autosize();
      updateSendState();
      ask(text);
    }

    form.addEventListener("submit", (e) => { e.preventDefault(); submit(); });
    input.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); submit(); }
    });
    input.addEventListener("input", () => { autosize(); updateSendState(); });
    document.querySelectorAll(".chip").forEach(chip => {
      chip.addEventListener("click", () => ask(chip.dataset.prompt));
    });

    // ---------- init ----------
    checkConnection();
    refreshConversations();
    loadPreferencesAndMemories();
    updateSendState();
    updateHeaderActions();
    if (canHover) input.focus();
  </script>
</body>
</html>
